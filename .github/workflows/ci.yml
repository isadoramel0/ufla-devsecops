name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches:
      - main
      - atividade-*
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Executar Ruff
        run: ruff check .

  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Executar pytest
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Publicar cobertura para o SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ufla-devops-shop:ci
          outputs: type=docker,dest=/tmp/ufla-devops-shop-image.tar

      - name: Guardar imagem para publicação
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/ufla-devops-shop-image.tar
          if-no-files-found: error
          retention-days: 1

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Baixar imagem construída
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Carregar imagem Docker
        run: docker load --input /tmp/ufla-devops-shop-image.tar

      - name: Preparar manifests para scan filesystem
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-requirements"
          cp requirements.txt "$RUNNER_TEMP/trivy-requirements/requirements.txt"
          sed '/^-r requirements\.txt$/d' requirements-dev.txt >> "$RUNNER_TEMP/trivy-requirements/requirements.txt"
          touch trivy-fs-low-medium.txt trivy-image-low-medium.txt
          touch trivy-fs-bloqueante.txt trivy-image-bloqueante.txt

      - name: Trivy fs LOW/MEDIUM (informativo)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: ${{ runner.temp }}/trivy-requirements
          scanners: vuln
          severity: LOW,MEDIUM
          exit-code: '0'
          format: table
          output: trivy-fs-low-medium.txt
          cache: true

      - name: Trivy image LOW/MEDIUM (informativo)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ufla-devops-shop:ci
          severity: LOW,MEDIUM
          exit-code: '0'
          format: table
          output: trivy-image-low-medium.txt
          cache: true
          skip-setup-trivy: true

      - name: Trivy fs HIGH/CRITICAL (bloqueante)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: ${{ runner.temp }}/trivy-requirements
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-fs-bloqueante.txt
          cache: true
          skip-setup-trivy: true

      - name: Exibir relatório filesystem bloqueante
        if: always()
        run: cat trivy-fs-bloqueante.txt

      - name: Trivy image HIGH/CRITICAL (bloqueante)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ufla-devops-shop:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-image-bloqueante.txt
          cache: true
          skip-setup-trivy: true

      - name: Exibir relatório da imagem bloqueante
        if: always()
        run: cat trivy-image-bloqueante.txt

      - name: Publicar relatórios Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-trivy
          path: |
            trivy-fs-low-medium.txt
            trivy-image-low-medium.txt
            trivy-fs-bloqueante.txt
            trivy-image-bloqueante.txt
          if-no-files-found: error

  sbom:
    name: SBOM (Syft)
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Baixar imagem construída
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Carregar imagem Docker
        run: docker load --input /tmp/ufla-devops-shop-image.tar

      - name: Gerar SBOM com Syft
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ufla-devops-shop:ci
          format: spdx-json
          output-file: sbom-imagem.spdx.json
          artifact-name: sbom-imagem

  sonarcloud:
    name: SonarCloud
    # PRs de forks não recebem SONAR_TOKEN; somente esses PRs ignoram o job.
    # PRs do próprio repositório e pushes em main/tags v* sempre executam e bloqueiam.
    if: >-
      ${{ (github.event_name == 'push' &&
           (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Baixar cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          path: .

      - name: Analisar no SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        with:
          args: >-
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish-ghcr:
    name: Publicar no GHCR
    needs: [docker-build, gitleaks, sonarcloud, trivy, sbom]
    runs-on: ubuntu-latest
    if: >-
      ${{ always() &&
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
          needs.docker-build.result == 'success' &&
          needs.gitleaks.result == 'success' &&
          needs.sonarcloud.result == 'success' &&
          needs.trivy.result == 'success' &&
          needs.sbom.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar imagem construída
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Carregar imagem Docker
        run: docker load --input /tmp/ufla-devops-shop-image.tar

      - name: Calcular tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Marcar e publicar imagem
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] || continue
            docker tag ufla-devops-shop:ci "$image_tag"
            docker push "$image_tag"
          done <<< "$IMAGE_TAGS"
