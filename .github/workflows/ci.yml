name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches:
      - main
      - atividade-*
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Executar Ruff
        run: ruff check .

  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Executar pytest
        run: pytest --cov=app --cov-report=term-missing

  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ufla-devops-shop:ci
          outputs: type=docker,dest=/tmp/ufla-devops-shop-image.tar

      - name: Guardar imagem para publicação
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/ufla-devops-shop-image.tar
          if-no-files-found: error
          retention-days: 1

  publish-ghcr:
    name: Publicar no GHCR
    runs-on: ubuntu-latest
    needs: docker-build
    if: >-
      ${{ github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar imagem construída
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Carregar imagem Docker
        run: docker load --input /tmp/ufla-devops-shop-image.tar

      - name: Calcular tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Marcar e publicar imagem
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] || continue
            docker tag ufla-devops-shop:ci "$image_tag"
            docker push "$image_tag"
          done <<< "$IMAGE_TAGS"
